<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résultats — Hervé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/resultats.css" />
  </head>
  <body>
    <div class="noise"></div>

    <header class="topbar">
      <a href="./index.html" class="brand-link">
        <img src="./doc/logo.svg" alt="Logo Hervé" class="topbar-logo" />
        <span class="topbar-name">
          <span class="brand-her">Her</span><span class="brand-ve">vé</span>
        </span>
      </a>

      <form class="search-mini" action="/resultats.html" method="get">
        <svg
          class="search-icon-sm"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input
          type="text"
          name="search"
          value="{{QUERY}}"
          placeholder="Nouvelle recherche…"
          autocomplete="off"
        />
        <button type="submit" aria-label="Chercher">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>
    </header>

    <main class="results-main">
      <div class="results-inner">
        <div class="results-meta">
          <span class="results-for">Résultats pour</span>
          <h1 class="results-query">{{QUERY}}</h1>
        </div>

        <div class="results-box">
          <div id="results">{{RESULTS}}</div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>© Hervé 2026</span>
      <span class="dot">·</span>
      <a href="./index.html">Accueil</a>
      <span class="dot">·</span>
      <a href="#">Confidentialité</a>
    </footer>
  </body>
</html>
